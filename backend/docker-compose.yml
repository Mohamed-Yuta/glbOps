services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glbops}
      POSTGRES_USER: ${POSTGRES_USER:-glbops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glbops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
